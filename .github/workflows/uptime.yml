name: Teamfare uptime
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teamfare-uptime
  cancel-in-progress: false
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public HTTPS and database readiness
        run: |
          node --input-type=module <<'JS'
          const url = 'https://teamfare.dixmail.xyz/api/health';
          let healthy = false;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const start = Date.now();
              const response = await fetch(url, { signal: AbortSignal.timeout(15000), redirect: 'error' });
              const result = await response.json();
              if (response.ok && result.ok === true) {
                console.log(`Teamfare public HTTPS is healthy (${Date.now()-start}ms).`);
                healthy = true;
                break;
              }
              console.error(`Health attempt ${attempt}: HTTP ${response.status}.`);
            } catch {
              console.error(`Health attempt ${attempt}: request failed or timed out.`);
            }
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!healthy) {
            console.error('::error::Teamfare public HTTPS/database readiness failed all attempts. Investigate the Vultr deployment.');
            process.exitCode = 1;
          }
          JS
